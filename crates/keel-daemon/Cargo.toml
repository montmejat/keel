[package]
name = "keel-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Runs a keel dataflow's nodes, routes messages between them, and serves the control API"

[dependencies]
keel = { path = "../keel" }
keel-record = { path = "../keel-record" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
