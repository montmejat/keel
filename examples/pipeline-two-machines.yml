# The camera pipeline split over two machines. Start a daemon for each first:
#   keel daemon --listen 127.0.0.1:7401     # "robot"
#   keel daemon --listen 127.0.0.1:7402     # "base"
# Frames cross from robot to base, brightness reports come back.
machines:
  robot: 127.0.0.1:7401
  base: 127.0.0.1:7402

nodes:
  - id: camera
    machine: robot
    path: ../target/debug/camera

  - id: detector
    machine: base
    path: ../target/debug/detector
    inputs:
      frames: camera/frames

  - id: recorder
    machine: robot
    path: ../target/debug/recorder
    inputs:
      brightness: detector/brightness
