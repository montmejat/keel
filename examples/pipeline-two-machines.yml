# The camera pipeline split over two machines. Start a daemon for each first:
#   keel daemon --listen 127.0.0.1:7401     # "robot"
#   keel daemon --listen 127.0.0.1:7402     # "base"
# Frames cross from robot to base, brightness reports come back. keel builds
# the nodes for each machine and ships them to its daemon (`keel history`).
machines:
  robot: 127.0.0.1:7401
  base: 127.0.0.1:7402

nodes:
  - id: camera
    machine: robot
    build: camera

  - id: detector
    machine: base
    build: detector
    inputs:
      frames: camera/frames

  - id: recorder
    machine: robot
    build: recorder
    inputs:
      brightness: detector/brightness
