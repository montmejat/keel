# One hop, measured one way: a message every millisecond, like a control
# loop, from publish to the receiver having it in hand. The sink watches for
# messages without sleeping, keeping its CPU busy; hop.yml has it sleep.
# Compare both with what the machine allows, keel out of the way:
#   ./target/release/hop-floor --cpus 2,4 --mode futex    # or --mode spin
# Build with `cargo build --release` first. CPUs 2 and 4 are separate
# physical cores here; pick yours from `lscpu -e`.
nodes:
  - id: source
    path: ../target/release/hop-source
    rt: { cpus: [2] }

  - id: sink
    path: ../target/release/hop-sink
    args: ["--spin", "forever"]
    rt: { cpus: [4] }
    inputs:
      data: source/data
