# Pollen's Microduck, fifteen Dynamixel XL330s and its IMU on one serial
# bus, driven by keel: keel-dynamixel is the bus master, microduck-stand the
# controller, holding the standing pose (decision 0034: a command's position
# is its servo's goal).
#
# The duck is drydock (github.com/montmejat/drydock): Pollen's MuJoCo model
# behind a pseudo-terminal, answering as the servos and the IMU board would.
# Start it, in drydock's repository (it fetches the model the first time),
# in lockstep, so the duck stands until keel drives it:
#
#   drydock examples/microduck/robot.yml --lockstep 50
#
# On the real duck, `--port /dev/ttyS2`; nothing else changes.
nodes:
  - id: duck
    path: ../target/debug/keel-dynamixel
    args:
      - --port
      - /tmp/microduck-tty
      - --hz
      - "50"
      - --motors
      - 20,21,22,23,24,30,31,32,33,34,10,11,12,13,14
      # Pollen's runtime sets every servo's P gain to 200.
      - --p-gain
      - "200"
      # The body IMU, on the bus as device 200, mounted turned +90° about y.
      - --imu
      - "200"
      - --imu-mount
      - 0.7071068,0,0.7071068,0
      - --names
      - left_hip_yaw,left_hip_roll,left_hip_pitch,left_knee,left_ankle,neck_pitch,head_pitch,head_yaw,head_roll,mouth,right_hip_yaw,right_hip_roll,right_hip_pitch,right_knee,right_ankle
    restart: on-failure
    inputs:
      command: { source: controller/command, keep: latest }

  - id: controller
    path: ../target/debug/microduck-stand
    inputs:
      state: { source: duck/state, keep: latest }
      imu: { source: duck/imu, keep: latest }
